<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Sistema de Captação</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>
<body style="max-width: 400px; margin-top: 10vh;">

<h1>🔐 Acesso</h1>
<p class="subtitle">Entre com seu e-mail e senha</p>

<div class="field">
  <label for="email">E-mail</label>
  <input type="email" id="email" placeholder="seu@email.com">
</div>
<div class="field">
  <label for="password">Senha</label>
  <input type="password" id="password" placeholder="Sua senha">
</div>

<div class="h-captcha" data-sitekey="COLE_SUA_SITE_KEY_AQUI"></div>

<button class="btn-primary" style="width: 100%; margin-top: 16px;" onclick="fazerLogin()">Entrar</button>
<p id="msg" style="margin-top: 16px; text-align: center; font-weight: bold;"></p>

<script>
const supabaseUrl = 'https://zqwzcfarpexciiajiigp.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxd3pjZmFycGV4Y2lpYWppaWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjAzODMsImV4cCI6MjEwNTgzNjM4M30.0FPbUKWIL06kOJxvBrm2RDDIfkyjq3S_Tos-mVyrZmw';

const sb = supabase.createClient(supabaseUrl, supabaseKey, {
  auth: {
    persistSession: true,
    storageKey: 'sistema-capta-auth-token',
    storage: window.localStorage
  }
});

async function fazerLogin() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  
  const hcaptchaToken = hcaptcha.getResponse();
  if (!hcaptchaToken) {
    msg.style.color = '#e03e3e';
    msg.textContent = 'Por favor, complete o captcha.';
    return;
  }
  
  if (!email || !password) {
    msg.style.color = '#e03e3e';
    msg.textContent = 'Preencha e-mail e senha.';
    return;
  }

  msg.style.color = '#787774';
  msg.textContent = 'Verificando...';

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  
  if (error) {
    msg.style.color = '#e03e3e';
    msg.textContent = 'Erro: ' + error.message;
    hcaptcha.reset();
  } else {
    msg.style.color = '#4dab5c';
    msg.textContent = 'Sucesso! Redirecionando...';
    setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
  }
}
</script>
</body>
</html>
