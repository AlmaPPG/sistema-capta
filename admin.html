<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin · Sistema de Captação</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
  <h1>📊 Painel Admin</h1>
  <button class="btn-secondary" onclick="fazerLogout()">Sair</button>
</div>
<p class="subtitle">Visão geral de todos os clientes e projetos</p>

<div id="loading">Carregando dados...</div>
<div id="conteudo"></div>

<script>
const supabaseUrl = 'https://zqwzcfarpexciiajiigp.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxd3pjZmFycGV4Y2lpYWppaWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjAzODMsImV4cCI6MjEwNTgzNjM4M30.0FPbUKWIL06kOJxvBrm2RDDIfkyjq3S_Tos-mVyrZmw';
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

async function init() {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  // Busca todos os projetos e seus clientes relacionados
  const { data: projects, error } = await supabase
    .from('projects')
    .select(`
      id,
      nome,
      status,
      clients ( nome, email )
    `);

  if (error) {
    document.getElementById('conteudo').innerHTML = `<p style="color: var(--danger)">Erro ao carregar: ${error.message}</p>`;
    document.getElementById('loading').style.display = 'none';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  
  if (projects.length === 0) {
    document.getElementById('conteudo').innerHTML = '<p class="empty-state">Nenhum projeto cadastrado ainda.</p>';
    return;
  }

  let html = '<h2>Projetos Ativos</h2>';
  projects.forEach(p => {
    html += `
      <div class="card">
        <h3>${p.nome}</h3>
        <p><strong>Cliente:</strong> ${p.clients?.nome || 'N/A'} (${p.clients?.email || 'N/A'})</p>
        <p><strong>Status:</strong> ${p.status || 'Em desenvolvimento'}</p>
      </div>
    `;
  });
  document.getElementById('conteudo').innerHTML = html;
}

async function fazerLogout() {
  await supabase.auth.signOut();
  window.location.href = 'login.html';
}

init();
</script>
</body>
</html>
